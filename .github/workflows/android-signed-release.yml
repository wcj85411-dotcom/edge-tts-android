name: Build signed Edge TTS release

on:
  workflow_dispatch:
  push:
    branches:
      - polyphone-emotion-lab

permissions:
  contents: read

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and native build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.EDGE_TTS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          mkdir -p "$RUNNER_TEMP/edge-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/edge-signing/edge-tts-release.jks"
          test -s "$RUNNER_TEMP/edge-signing/edge-tts-release.jks"

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed ARM64 release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
          LIBOPUS_STATIC: "1"
          OPUS_STATIC: "1"
          EDGE_TTS_KEYSTORE_PATH: ${{ runner.temp }}/edge-signing/edge-tts-release.jks
          EDGE_TTS_STORE_PASSWORD: ${{ secrets.EDGE_TTS_STORE_PASSWORD }}
          EDGE_TTS_KEY_ALIAS: ${{ secrets.EDGE_TTS_KEY_ALIAS }}
          EDGE_TTS_KEY_PASSWORD: ${{ secrets.EDGE_TTS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature and print certificate fingerprint
        env:
          BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/36.0.0
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: edge-tts-0.1.11-signed-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
