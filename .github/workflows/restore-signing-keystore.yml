name: Restore Edge TTS signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore keystore from repository secret
        env:
          KEYSTORE_B64: ${{ secrets.EDGE_TTS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "EDGE_TTS_KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi
          mkdir -p restored
          printf '%s' "${KEYSTORE_B64}" | base64 --decode > restored/edge-tts-release.jks
          test -s restored/edge-tts-release.jks
          file restored/edge-tts-release.jks
      - name: Upload restored keystore
        uses: actions/upload-artifact@v4
        with:
          name: edge-tts-release-keystore
          path: restored/edge-tts-release.jks
          retention-days: 1
          if-no-files-found: error
