name: Build Edge TTS test APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/chinese-novel-voices

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and native build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.14904198" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Configure stable APK signing
        env:
          EDGE_TTS_KEYSTORE_BASE64: ${{ secrets.EDGE_TTS_KEYSTORE_BASE64 }}
          EDGE_TTS_STORE_PASSWORD: ${{ secrets.EDGE_TTS_STORE_PASSWORD }}
          EDGE_TTS_KEY_ALIAS: ${{ secrets.EDGE_TTS_KEY_ALIAS }}
          EDGE_TTS_KEY_PASSWORD: ${{ secrets.EDGE_TTS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$EDGE_TTS_KEYSTORE_BASE64" || { echo "Missing EDGE_TTS_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$EDGE_TTS_STORE_PASSWORD" || { echo "Missing EDGE_TTS_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$EDGE_TTS_KEY_ALIAS" || { echo "Missing EDGE_TTS_KEY_ALIAS repository secret"; exit 1; }
          test -n "$EDGE_TTS_KEY_PASSWORD" || { echo "Missing EDGE_TTS_KEY_PASSWORD repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/edge-tts-signing"
          echo "$EDGE_TTS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/edge-tts-signing/release.jks"
          echo "EDGE_TTS_KEYSTORE_PATH=$RUNNER_TEMP/edge-tts-signing/release.jks" >> "$GITHUB_ENV"
          echo "EDGE_TTS_STORE_PASSWORD=$EDGE_TTS_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "EDGE_TTS_KEY_ALIAS=$EDGE_TTS_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "EDGE_TTS_KEY_PASSWORD=$EDGE_TTS_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build ARM64 debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
          LIBOPUS_STATIC: "1"
          OPUS_STATIC: "1"
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: edge-tts-arm64-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
